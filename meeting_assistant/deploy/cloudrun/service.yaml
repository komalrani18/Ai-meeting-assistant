apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: meeting-assistant-backend
  annotations:
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "5"
        run.googleapis.com/cpu-throttling: "false"
    spec:
      containerConcurrency: 4
      timeoutSeconds: 900
      containers:
        - image: gcr.io/PROJECT_ID/meeting-assistant-backend
          ports:
            - containerPort: 8000
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
          env:
            - name: LLM_PROVIDER
              value: "groq"
            - name: LLM_MODEL
              value: "llama-3.1-70b-versatile"
            - name: WHISPER_MODEL_SIZE
              value: "base"
            - name: WHISPER_DEVICE
              value: "cpu"
            - name: WHISPER_COMPUTE_TYPE
              value: "int8"
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: groq-api-key
                  key: latest
