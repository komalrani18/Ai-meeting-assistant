version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - upload_data:/app/data/uploads
      - results_data:/app/data/results
      # Cache Whisper model weights across container restarts
      - whisper_cache:/root/.cache/huggingface
    restart: unless-stopped
    # Uncomment to give the container more headroom for larger Whisper models:
    # deploy:
    #   resources:
    #     limits:
    #       memory: 4g

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  upload_data:
  results_data:
  whisper_cache:
